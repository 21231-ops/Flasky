{% extends "base.html" %}
{% block title %}Flasky - 确认你的账户{% endblock %}

{% block page_content %}
<div class="page-header">
    <h1>你好，{{ current_user.username }}！</h1>
</div>
<div class="alert alert-warning">
    你还没有确认你的账户。
</div>
<p>
    在访问本站前，你需要先确认你的账户。
    查看你的收件箱，你应该收到一封带有确认链接的邮件。
</p>
<p>
    需要重新发送确认邮件？
    <a href="{{ url_for('auth.resend_confirmation') }}">点击这里</a>
</p>
{% endblock %}
